name: Rebuild King Musah Media Site

on:
  push:
    branches: [ main ]
    paths:
      - 'media/data/articles.json'
      - 'media/generate_site.py'
      - 'media/assets/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild the site from articles.json
        run: |
          cd media
          python3 generate_site.py

      - name: Publish the rebuilt pages
        run: |
          git config user.name "King Musah Media Auto-Build"
          git config user.email "actions@github.com"
          git add media/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-rebuild site from articles.json [skip ci]"
            # Pull in case another run (e.g. the photo commit) pushed first —
            # this is what was missing, and caused the failure emails.
            git pull --rebase origin main
            git push
          else
            echo "Nothing changed, nothing to push."
          fi
