name: Rebuild King Musah Media Site

on:
  push:
    branches: [ main ]
    paths:
      - 'media/data/articles.json'
      - 'media/generate_site.py'
      - 'media/assets/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild the site from articles.json
        run: |
          cd media
          python3 generate_site.py

      - name: Publish the rebuilt pages
        run: |
          git config user.name "King Musah Media Auto-Build"
          git config user.email "actions@github.com"
          git add media/

          if git diff --staged --quiet; then
            echo "Nothing changed, nothing to push."
            exit 0
          fi

          git commit -m "Auto-rebuild site from articles.json [skip ci]"

          # If another run (e.g. the photo commit firing seconds apart) already
          # pushed its own rebuild, our push will fail — and that's fine. Their
          # rebuild is equally correct since it's generated from the same
          # articles.json. We don't try to merge generated HTML; we just stand
          # down instead of failing the whole job.
          if git push; then
            echo "Published successfully."
          else
            echo "Another run already published an equivalent rebuild — standing down, not a failure."
            exit 0
          fi
